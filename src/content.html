<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Office JavaScript API. -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    
    <title>Extensible Content</title>
</head>
<body class="ms-Fabric">
    <div id="xc-context" class="hidden">
        <fluent-menu>
            <fluent-menu-item onclick="xc.show('xc-settings')">Edit</fluent-menu-item>
            <fluent-divider></fluent-divider>
            <fluent-menu-item>Refresh</fluent-menu-item>
            <fluent-divider></fluent-divider>
            <fluent-menu-item>Save As</fluent-menu-item>
            <fluent-menu-item>Print</fluent-menu-item>
            <fluent-divider></fluent-divider>
            <fluent-menu-item>Inspect</fluent-menu-item>
        </fluent-menu>
    </div>
    <div id="xc-display" class="xc-view hidden"></div>
    <div id="xc-configuration" class="xc-view">
        <fluent-button id="xc-configuration-back-button" appearance="accent" onclick="xc.toggleView();">
            <i class="ms-Icon ms-Icon--Back" aria-hidden="true"></i>
        </fluent-button>
        <fluent-button id="xc-configuration-save-button" appearance="accent" onclick="xc.saveConfiguration();">
            <i class="ms-Icon ms-Icon--Save" aria-hidden="true"></i>
        </fluent-button>
        <fluent-tabs activeid="xc-configuration-content">
            <fluent-tab id="xc-configuration-content">Content</fluent-tab>
            <fluent-tab id="xc-configuration-settings">Settings</fluent-tab>

            <fluent-tab-panel id="xc-configuration-content-panel"></fluent-tab-panel>

            <fluent-tab-panel id="xc-configuration-settings-panel">
                <fieldset>
                    <legend>Configuration Access</legend>
                    <fluent-switch>
                        <span slot="checked-message">On</span>
                        <span slot="unchecked-message">Off</span>
                        <label for="cap-switch">Right Click:</label>
                    </fluent-switch><br>
                    <fluent-switch>
                        <span slot="checked-message">On</span>
                        <span slot="unchecked-message">Off</span>
                        <label for="cap-switch">Context Menu:</label>
                    </fluent-switch><br>
                    <fluent-switch>
                        <span slot="checked-message">On</span>
                        <span slot="unchecked-message">Off</span>
                        <label for="cap-switch">Title Bar:</label>
                    </fluent-switch><br>
                    <fluent-switch>
                        <span slot="checked-message">On</span>
                        <span slot="unchecked-message">Off</span>
                        <label for="cap-switch">Hot Key:</label>
                    </fluent-switch>
                </fieldset><br>
                <fieldset>
                    <legend>Title Bar</legend>
                    <fluent-switch>
                        <span slot="checked-message">On</span>
                        <span slot="unchecked-message">Off</span>
                        <label for="cap-switch">Display:</label>
                    </fluent-switch><br>
                    <label for="cap-switch">Title:</label>
                    <fluent-text-field placeholder="Extensible Content"></fluent-text-field>
                </fieldset><br>
                <fieldset>
                    <legend>Right Click</legend>
                    <fluent-switch>
                        <span slot="checked-message">On</span>
                        <span slot="unchecked-message">Off</span>
                        <label for="cap-switch">Display:</label>
                    </fluent-switch><br>
                    <label for="cap-switch">Title:</label>
                    <fluent-text-field placeholder="Extensible Content"></fluent-text-field>
                </fieldset><br>
            </fluent-tab-panel>
        </fluent-tabs>
    </div>
</body>
</html>
